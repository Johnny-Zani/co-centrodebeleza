<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.O. Centro de Beleza</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #C9A96E;
    --gold-lt:#E8D5B0;
    --onyx:   #0D0D0D;
    --dark:   #1A1A1A;
    --mid:    #2C2C2C;
    --warm:   #F7F3EE;
    --text:   #3A3A3A;
    --muted:  #888;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--warm);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(10px);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; letter-spacing: 3px;
    color: var(--gold); text-transform: uppercase;
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-size: 0.78rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.65); text-decoration: none;
    transition: color .2s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--onyx); background: var(--gold);
    padding: 10px 22px; text-decoration: none;
    transition: opacity .2s;
  }
  .nav-cta:hover { opacity: .85; }
  .nav-toggle {
    display: none;
    background: none; border: 0; cursor: pointer;
    padding: 8px; margin-left: auto; margin-right: 14px;
  }
  .nav-toggle span {
    display: block; width: 22px; height: 1.5px;
    background: var(--gold); margin: 4px 0;
    transition: transform .25s, opacity .25s;
  }
  .nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

  /* ── HERO ── */
  #hero {
    height: 100vh; /* fallback pra navegadores sem suporte a svh */
    height: 100svh; /* exclui a área da barra de endereço do navegador no celular */
    min-height: 560px;
    display: flex; align-items: center; justify-content: center;
    background: var(--onyx);
    position: relative; overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(201,169,110,0.22) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 80%, rgba(201,169,110,0.10) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 75%, rgba(201,169,110,0.08) 0%, transparent 40%);
    animation: bgPulse 8s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    from { opacity: 0.7; }
    to   { opacity: 1; }
  }
  .hero-particles {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .hero-particles::before,
  .hero-particles::after {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.06);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: ringPulse 6s ease-in-out infinite;
  }
  .hero-particles::after {
    width: 900px; height: 900px;
    border-color: rgba(201,169,110,0.04);
    animation-delay: 1.5s;
  }
  @keyframes ringPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
  }
  .hero-lines {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(90deg, rgba(201,169,110,0.035) 1px, transparent 1px),
      linear-gradient(0deg, rgba(201,169,110,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .hero-sweep {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(201,169,110,0.07) 50%, transparent 65%);
    animation: sweep 5s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .hero-content {
    position: relative; text-align: center; padding: 0 24px;
    display: flex; flex-direction: column; align-items: center;
  }

  .hero-logo-wrap {
    margin-bottom: 32px;
    opacity: 0; transform: scale(0.88);
    animation: logoIn .9s cubic-bezier(.22,1,.36,1) .2s forwards;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }
  .hero-logo-svg {
    width: clamp(180px, 30vw, 380px);
    aspect-ratio: 1 / 1;
    filter: drop-shadow(0 0 28px rgba(201,169,110,0.45));
  }

  .hero-eyebrow {
    font-size: 0.68rem; letter-spacing: 5px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px;
    opacity: 0; animation: fadeUp .7s ease .9s forwards;
  }
  .hero-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.05rem, 2.8vw, 1.55rem);
    font-weight: 300; color: rgba(255,255,255,0.5);
    letter-spacing: 4px; text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0; animation: fadeUp .7s ease 1.1s forwards;
  }
  .hero-tagline em {
    font-style: italic; color: rgba(201,169,110,0.75);
  }
  .hero-divider {
    width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 18px auto 28px;
    opacity: 0; animation: fadeUp .5s ease 1.3s forwards;
  }
  .hero-btns {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    opacity: 0; animation: fadeUp .7s ease 1.5s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn-primary {
    padding: 14px 36px; background: var(--gold);
    color: var(--onyx); text-decoration: none;
    font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
    font-weight: 500; transition: opacity .2s, box-shadow .2s;
  }
  .btn-primary:hover { opacity: .9; box-shadow: 0 0 24px rgba(201,169,110,0.45); }
  .btn-ghost {
    padding: 14px 36px; border: 1px solid rgba(201,169,110,0.4);
    color: var(--gold); text-decoration: none;
    font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
    transition: border-color .2s, color .2s, background .2s;
  }
  .btn-ghost:hover { border-color: var(--gold); color: #fff; background: rgba(201,169,110,0.08); }

  section { padding: 100px 48px; }
  .section-eyebrow {
    font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 300; line-height: 1.1;
    color: var(--onyx); margin-bottom: 16px;
  }
  .section-title em { font-style: italic; color: var(--gold); }
  .section-desc {
    font-size: 0.9rem; color: var(--muted); line-height: 1.8;
    max-width: 500px;
  }
  .section-header { margin-bottom: 60px; }

  /* ── PROFISSIONAIS ── */
  #profissionais { background: var(--onyx); }
  #profissionais .section-title { color: #fff; }
  #profissionais .section-desc { color: rgba(255,255,255,0.4); }

  .prof-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1px;
    border: 1px solid rgba(201,169,110,0.15);
  }
  .prof-card {
    padding: 32px 28px;
    border: 1px solid rgba(201,169,110,0.08);
    transition: background .2s;
  }
  .prof-card:hover { background: rgba(201,169,110,0.05); }
  .prof-initial {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem; font-weight: 300; font-style: italic;
    color: var(--gold); line-height: 1; margin-bottom: 12px;
  }
  .prof-name {
    font-size: 0.85rem; font-weight: 500; color: #fff;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .prof-role {
    font-size: 0.72rem; color: rgba(255,255,255,0.35);
    line-height: 1.6;
  }

  /* ── SERVIÇOS ── */
  #servicos { background: var(--warm); }

  .cat-block { margin-bottom: 72px; }
  .cat-label {
    font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid rgba(201,169,110,0.25);
  }
  .servico-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1px;
    background: rgba(201,169,110,0.12);
  }

  /* ── NOIVA ── */
  #noiva { background: var(--onyx); }
  #noiva .section-title { color: #fff; }
  #noiva .section-desc { color: rgba(255,255,255,0.4); }

  .noiva-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .noiva-card {
    border: 1px solid rgba(201,169,110,0.2);
    padding: 40px 32px;
    position: relative; overflow: hidden;
    transition: border-color .2s;
  }
  .noiva-card:hover { border-color: var(--gold); }
  .noiva-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
    z-index: 1;
  }
  .noiva-pacote {
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 20px;
  }
  .noiva-items { list-style: none; }
  .noiva-items li {
    font-size: 0.8rem; color: rgba(255,255,255,0.55);
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; gap: 10px; line-height: 1.4;
  }
  .noiva-items li::before {
    content: ''; width: 5px; height: 1px;
    background: var(--gold); flex-shrink: 0;
  }

  /* ── TRATAMENTOS DESTAQUE ── */
  #tratamentos { background: #fff; }

  .trat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  @media (min-width: 1200px) {
    .trat-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .trat-card {
    padding: 36px 30px;
    border: 1px solid rgba(201,169,110,0.2);
    position: relative;
  }
  .trat-tag {
    display: inline-block;
    font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--onyx); background: var(--gold-lt);
    padding: 4px 10px; margin-bottom: 20px;
  }
  .trat-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 400; color: var(--onyx);
    line-height: 1.2; margin-bottom: 12px;
  }
  .trat-desc {
    font-size: 0.8rem; color: var(--muted); line-height: 1.75;
    margin-bottom: 24px;
  }
  .trat-footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(201,169,110,0.2); padding-top: 20px;
  }
  .trat-sessoes {
    font-size: 0.7rem; color: var(--muted); text-align: right;
  }

  /* ── INSTASTYLE ── */
  #instagram {
    background: var(--onyx); text-align: center; padding: 80px 48px;
  }
  #instagram .section-title { color: #fff; }
  .insta-handle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-style: italic; color: var(--gold);
    margin-top: 16px; text-decoration: none; display: block;
    transition: opacity .2s;
  }
  .insta-handle:hover { opacity: .75; }

  /* ── CTA FINAL ── */
  #cta {
    background: var(--gold); padding: 80px 48px; text-align: center;
  }
  .cta-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300; color: var(--onyx); margin-bottom: 12px;
    line-height: 1.1;
  }
  .cta-sub {
    font-size: 0.85rem; color: rgba(13,13,13,0.6);
    margin-bottom: 36px; line-height: 1.6;
  }
  .btn-dark {
    display: inline-block;
    padding: 16px 44px; background: var(--onyx);
    color: var(--gold); text-decoration: none;
    font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
    font-weight: 500; transition: opacity .2s;
  }
  .btn-dark:hover { opacity: .85; }
  .cta-contato {
    font-size: 0.72rem; color: rgba(13,13,13,0.45);
    margin-top: 28px; line-height: 1.6;
  }

  /* ── FOOTER ── */
  footer {
    background: #080808; padding: 48px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 20px;
  }
  .footer-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold);
  }
  .footer-copy {
    font-size: 0.72rem; color: rgba(255,255,255,0.2);
  }

  .gold-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0;
  }

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    nav { padding: 16px 20px; }
    .nav-toggle { display: block; }
    .nav-links {
      display: flex; flex-direction: column; gap: 0;
      position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(13,13,13,0.98);
      backdrop-filter: blur(10px);
      max-height: 0; overflow: hidden;
      transition: max-height .3s ease;
    }
    .nav-links.aberto { max-height: 320px; }
    .nav-links a {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(201,169,110,0.12);
    }
    section { padding: 72px 20px; }
    footer { padding: 32px 20px; }
    #instagram { padding: 60px 20px; }
    #cta { padding: 60px 20px; }
  }

  /* ── MOLDURA 3:4 — todas as fotos do site são retrato ── */
  .moldura {
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: #0f0f0f;
  }
  .moldura img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform .5s ease;
  }
  .servico-item:hover .moldura img,
  .trat-card:hover .moldura img,
  .noiva-card:hover .moldura img,
  .prof-card:hover .moldura img { transform: scale(1.03); }

  /* ── CARD VERTICAL ── */
  .servico-item {
    background: var(--warm);
    display: flex; flex-direction: column;
    transition: background .18s;
  }
  .servico-item:hover { background: #fff; }
  .servico-body {
    padding: 20px;
    display: flex; flex-direction: column;
    flex: 1;
  }
  .servico-nome {
    font-size: 0.9rem; font-weight: 500; color: var(--onyx);
    line-height: 1.4; margin-bottom: 4px;
  }
  .servico-detalhe {
    font-size: 0.72rem; color: var(--muted); line-height: 1.5;
    margin-bottom: 12px;
  }

  /* ── PREÇO: prefixo discreto em cima, valor em destaque embaixo ── */
  .preco { margin-top: auto; padding-top: 12px; }
  .preco small {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.62rem; letter-spacing: 0.5px;
    color: var(--muted); margin-bottom: 2px;
  }
  .preco strong {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem; font-weight: 600; color: var(--gold);
    white-space: nowrap;
  }

  /* ── BOTÃO AGENDAR POR ITEM ── */
  .btn-agendar {
    display: block; margin-top: 14px;
    padding: 10px 18px; text-align: center;
    background: var(--onyx); color: var(--gold);
    font-size: 0.66rem; letter-spacing: 2px; text-transform: uppercase;
    text-decoration: none; transition: opacity .2s;
  }
  .btn-agendar:hover { opacity: .85; }
  .btn-agendar--inativo {
    opacity: .35; cursor: not-allowed;
  }
  /* especificidade (0,2,0) para vencer .btn-agendar:hover e .btn-dark:hover
     (ambos (0,2,0)) e (0,3,0) para vencer qualquer hover no próprio botão
     inativo — o estado inerte não pode "acender" ao passar o mouse. */
  .btn-agendar.btn-agendar--inativo,
  .btn-dark.btn-agendar--inativo,
  .btn-agendar.btn-agendar--inativo:hover,
  .btn-dark.btn-agendar--inativo:hover {
    opacity: .35;
    cursor: not-allowed;
    box-shadow: none;
  }
  .trat-card .btn-agendar, .noiva-card .btn-agendar {
    background: var(--gold); color: var(--onyx); margin-top: 22px;
  }

  /* grades acomodam o card vertical */
  .servico-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .trat-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .trat-inner { padding: 28px 30px; display: flex; flex-direction: column; flex: 1; }
  .noiva-card { padding: 0; overflow: hidden; }
  .noiva-inner { padding: 36px 32px; }
  .prof-card.tem-foto { padding: 0 0 24px; }
  .prof-card.tem-foto .moldura { margin-bottom: 18px; }
  .prof-card.tem-foto .prof-name,
  .prof-card.tem-foto .prof-role { padding: 0 24px; }
  .noiva-card .preco strong { color: #fff; font-size: 2.2rem; font-weight: 300; }
  .trat-card .preco strong { font-size: 1.7rem; font-weight: 300; }

</style>
<!--{{META}}-->
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">C.O. Centro de Beleza</div>
  <div class="nav-links" id="nav-links">
    <a href="#servicos">Serviços</a>
    <a href="#tratamentos">Tratamentos</a>
    <a href="#noiva">Noiva</a>
    <a href="#profissionais">Equipe</a>
  </div>
  <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links">
    <span></span><span></span><span></span>
  </button>
  <a href="#cta" class="nav-cta">Agendar</a>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-bg"></div>
  <div class="hero-particles"></div>
  <div class="hero-lines"></div>
  <div class="hero-sweep"></div>
  <div class="hero-content">

  <div class="hero-logo-wrap">
      <img class="hero-logo-svg" src="fotos/logo.png" alt="C.O. Centro de Beleza" width="600" height="600" fetchpriority="high">
    </div>

    <p class="hero-eyebrow">@c.ocentrodebeleza</p>
    <p class="hero-tagline">Sofisticação · <em>Cuidado</em> · Elegância</p>
    <div class="hero-divider"></div>
    <div class="hero-btns">
      <a href="#cta" class="btn-primary">Agendar Horário</a>
      <a href="#servicos" class="btn-ghost">Ver Serviços</a>
    </div>
  </div>
</section>

<div class="gold-line"></div>

<!-- PROFISSIONAIS -->
<section id="profissionais">
  <!--{{PROFISSIONAIS}}-->
</section>

<div class="gold-line"></div>

<!-- SERVIÇOS -->
<section id="servicos">
  <!--{{SERVICOS}}-->
</section>

<div class="gold-line"></div>

<!-- TRATAMENTOS -->
<section id="tratamentos">
  <!--{{TRATAMENTOS}}-->
</section>

<div class="gold-line"></div>

<!-- NOIVA -->
<section id="noiva">
  <!--{{NOIVA}}-->
</section>

<div class="gold-line"></div>

<!-- INSTAGRAM -->
<section id="instagram">
  <p class="section-eyebrow" style="color:var(--gold)">Siga no Instagram</p>
  <h2 class="section-title" style="color:#fff; font-size:clamp(1.5rem,3vw,2.2rem); margin-bottom:8px;">
    Acompanhe as transformações
  </h2>
  <a href="https://instagram.com/c.ocentrodebeleza" class="insta-handle" target="_blank">
    @c.ocentrodebeleza
  </a>
</section>

<!-- CTA -->
<section id="cta">
  <!--{{CTA}}-->
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">C.O. Centro de Beleza</div>
  <div class="footer-copy">© 2026 C.O. Centro de Beleza · @c.ocentrodebeleza</div>
</footer>

<script>
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.08 });
  els.forEach(el => io.observe(el));

  const toggle = document.querySelector('.nav-toggle');
  const menu = document.getElementById('nav-links');
  const setMenuAberto = aberto => {
    toggle.setAttribute('aria-expanded', String(aberto));
    toggle.setAttribute('aria-label', aberto ? 'Fechar menu' : 'Abrir menu');
  };
  toggle.addEventListener('click', () => setMenuAberto(menu.classList.toggle('aberto')));
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    menu.classList.remove('aberto');
    setMenuAberto(false);
  }));
</script>
</body>
</html>
